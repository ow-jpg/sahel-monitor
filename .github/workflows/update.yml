name: Update feed

on:
  # Times are UTC. 20:00 UTC is early morning in Canberra, so a fresh run is
  # waiting when you start work.
  schedule:
    - cron: "0 20 * * *"

  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

  # Also runs when you change the source list, so edits take effect at once.
  push:
    paths:
      - "sources.yml"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        id: collect
        # The collector exits non-zero on a suspiciously empty run. We want the
        # results committed either way, so the site can show what happened, but
        # we remember the outcome and fail the job at the end.
        continue-on-error: true
        run: python scripts/collect.py

      - name: Save the results
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add -A news.json analysis.json research.json state.json archive 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update feed: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # A scheduled run can collide with a commit you made in the browser.
            # Rebase and retry rather than failing the whole run.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $attempt failed, retrying."
              sleep 5
            done
          fi

      - name: Report a bad run
        # Turns a collapsed collection into a failed run, which GitHub emails
        # you about. Check Settings, Notifications, Actions if you get nothing.
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collection came back far below normal volume. The site"
          echo "::error::will show a warning. Open the Collect step above to see"
          echo "::error::which feeds failed."
          exit 1
