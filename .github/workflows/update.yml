name: Update feed

on:
  # Cron is always UTC and GitHub does not follow daylight saving, so the
  # Canberra time this lands at shifts by an hour across the year.
  #
  #   22:00 UTC  =  9am Canberra during daylight saving (AEDT, Oct to Apr)
  #              =  8am Canberra the rest of the year   (AEST, Apr to Oct)
  #
  # Chosen so the fresh run is always waiting by 9am rather than arriving
  # after it. Monday morning is covered by the daily run.
  #
  # Collection stays daily on purpose. Feeds only carry recent items, so a
  # weekly poll would silently miss anything that scrolled off between runs,
  # and the archive and the coverage baselines get thinner and less useful.
  # Reading it weekly is the point; collecting weekly would cost you data.
  schedule:
    - cron: "0 22 * * *"

  # Lets you run it by hand from the Actions tab.
  workflow_dispatch:

  # Also runs when you change the source list, so edits take effect at once.
  push:
    paths:
      - "sources.yml"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        id: collect
        # The collector exits non-zero on a suspiciously empty run. We want the
        # results committed either way, so the site can show what happened, but
        # we remember the outcome and fail the job at the end.
        continue-on-error: true
        run: python scripts/collect.py

      - name: Save the results
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add -A news.json analysis.json research.json state.json archive 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update feed: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # A scheduled run can collide with a commit you made in the browser.
            # Rebase and retry rather than failing the whole run.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $attempt failed, retrying."
              sleep 5
            done
          fi

      - name: Report a bad run
        # Turns a collapsed collection into a failed run, which GitHub emails
        # you about. Check Settings, Notifications, Actions if you get nothing.
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collection came back far below normal volume. The site"
          echo "::error::will show a warning. Open the Collect step above to see"
          echo "::error::which feeds failed."
          exit 1
