name: Update feed

# Manual only. Nothing runs on a schedule, so the site changes when you
# decide it should and not before. Start a run from the Actions tab:
# click "Update feed" on the left, then "Run workflow" on the right.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Get the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect
        id: collect
        # Exits non-zero on a suspiciously empty run. We still want the
        # results committed so the site can show what happened, so the
        # failure is remembered and applied at the end instead.
        continue-on-error: true
        run: python scripts/collect.py

      - name: Translate and summarise
        # Needs OPENROUTER_API_KEY. Without it this step does nothing and
        # passes, and the site works fine minus translations and the brief.
        # Never fails the run: a model being unavailable is not a collection
        # problem, and the previous brief stays in place.
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/enrich.py

      - name: Save the results
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add -A news.json analysis.json social.json research.json \
                     sources.json brief.json state.json archive 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update feed: $(date -u '+%Y-%m-%d %H:%M UTC')"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "Push attempt $attempt failed, retrying."
              sleep 5
            done
          fi

      - name: Report a bad run
        if: steps.collect.outcome == 'failure'
        run: |
          echo "::error::Collection came back far below normal volume."
          echo "::error::Open the Collect step above to see which feeds failed."
          exit 1
