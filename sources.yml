    lang: en
    url: https://www.longwarjournal.org/feed
  - name: Institute for Security Studies
    lang: en
    url: https://issafrica.org/rss/recent-publications.xml
  - name: Crisis Group
    lang: en
    url: https://www.crisisgroup.org/rss.xml
  - name: ACLED
    lang: en
    url: https://acleddata.com/feed/
  - name: Africa Center for Strategic Studies
    lang: en
    url: https://africacenter.org/feed/
  - name: Think tanks via search
    lang: en
    url: https://news.google.com/rss/search?q=(site%3Aissafrica.org+OR+site%3Acrisisgroup.org+OR+site%3Aacleddata.com+OR+site%3Atimbuktu-institute.org)+(Sahel+OR+Mali+OR+Niger+OR+Burkina)&hl=en-US&gl=US&ceid=US:en
  - name: Analyse francophone
    lang: fr
    url: https://news.google.com/rss/search?q=(site%3Airis-france.org+OR+site%3Atimbuktu-institute.org+OR+site%3Agrip.org)+(Sahel+OR+Mali+OR+Niger)&hl=fr&gl=FR&ceid=FR:fr


# -----------------------------------------------------------------------------
#  ACADEMIC RESEARCH
#  From OpenAlex, which is free and needs no key.
# -----------------------------------------------------------------------------

research_queries:
  - Sahel insurgency
  - jihadist violence West Africa
  - Mali conflict
  - Burkina Faso security
  - Wagner Group Africa
  - military coup West Africa
  - Boko Haram
  - ECOWAS regional security
  - Tuareg Azawad
  - Russian influence Africa


# -----------------------------------------------------------------------------
#  NOISE FILTER
#  Any headline containing one of these is dropped. Adding to this list is the
#  fastest way to improve signal, and you should expect to for a few weeks.
# -----------------------------------------------------------------------------

exclude:
  - football
  - afcon
  - "africa cup"
  - "cup of nations"
  - premier league
  - transfer window
  - striker
  - midfielder
  - "world cup qualif"
  - horoscope
  - lottery
  - "best hotels"
  - "travel guide"
  - recipe
  - "box office"
  - nollywood
  - afrobeats
  - "music video"
  - "net worth"
  - "how to watch"
  - betting
  - casino


# -----------------------------------------------------------------------------
#  SYNDICATION
#  Outlets that mostly republish agency copy. When several sources carry the
#  same story and they all trace back to one agency, it counts once rather
#  than inflating the corroboration score.
# -----------------------------------------------------------------------------

agencies:
  - reuters
  - "associated press"
  - " ap "
  - agence france-presse
  - afp
  - anadolu
  - xinhua
  - "deutsche presse"
  - dpa
  - efe
  - apa news

# Platforms that republish other people's copy. These are not newsrooms, so
# they are ignored entirely when counting corroboration and are never chosen
# as the version of a story to display. Without this, one wire story carried
# by six portals looks like six independent confirmations.
aggregators:
  - yahoo
  - msn
  - "google news"
  - flipboard
  - newsbreak
  - "news break"
  - smartnews
  - "the news international"
  - zerohedge
  - "one news page"
  - headtopics
  - "star tribune wire"
  - "bignewsnetwork"
  - "big news network"
